{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class='min-h-screen py-12'>
    <div class='max-w-6xl mx-auto px-4'>
        <h1 class='text-3xl font-bold mb-8'>Wedding Dashboard</h1>
        <div class='grid grid-cols-3 gap-6'>
            <div class='bg-white p-6 rounded-lg shadow'>
                <h3 class='text-lg font-semibold'>Total Guests</h3>
                <p class='text-3xl font-bold text-blue-500'>0</p>
            </div>
            <div class='bg-white p-6 rounded-lg shadow'>
                <h3 class='text-lg font-semibold'>Confirmed</h3>
                <p class='text-3xl font-bold text-green-500'>0</p>
            </div>
            <div class='bg-white p-6 rounded-lg shadow'>
                <h3 class='text-lg font-semibold'>Pending</h3>
                <p class='text-3xl font-bold text-yellow-500'>0</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
