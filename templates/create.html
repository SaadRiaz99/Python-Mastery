{% extends 'base.html' %}
{% block title %}Create Wedding{% endblock %}
{% block content %}
<div class='min-h-screen py-12'>
    <div class='max-w-2xl mx-auto px-4'>
        <h1 class='text-3xl font-bold mb-8'>Create Wedding Invitation</h1>
        <form id='weddingForm' class='space-y-6'>
            <div>
                <label class='block text-sm font-medium mb-2'>Bride Name</label>
                <input type='text' name='bride_name' class='w-full border rounded-lg px-4 py-2' required>
            </div>
            <div>
                <label class='block text-sm font-medium mb-2'>Groom Name</label>
                <input type='text' name='groom_name' class='w-full border rounded-lg px-4 py-2' required>
            </div>
            <button type='submit' class='w-full bg-blue-500 text-white py-3 rounded-lg'>Create</button>
        </form>
    </div>
</div>
{% endblock %}
