{% extends 'base.html' %}
{% block title %}Check Invitation{% endblock %}
{% block content %}
<div class='min-h-screen flex items-center justify-center'>
    <div class='max-w-md w-full p-8'>
        <h1 class='text-2xl font-bold mb-6 text-center'>Check Your Invitation</h1>
        <form id='checkForm' class='space-y-4'>
            <div>
                <label class='block text-sm font-medium mb-2'>Your Name</label>
                <input type='text' name='name' class='w-full border rounded-lg px-4 py-2' required>
            </div>
            <button type='submit' class='w-full bg-blue-500 text-white py-3 rounded-lg'>Check</button>
        </form>
    </div>
</div>
{% endblock %}
