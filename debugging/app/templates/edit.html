{% extends "base.html" %}

{% block title %}Edit assignment - Debug School App{% endblock %}

{% block content %}
<h1>Edit assignment #{{ assignment.id }}</h1>

<form class="new-form" method="post" action="/assignments/{{ assignment.id }}/edit">
  <input type="text" name="title" value="{{ assignment.title }}" required>
  <select name="subject">
    {% for s in subjects %}
    <option value="{{ s }}" {{ 'selected' if assignment.subject == s }}>{{ s }}</option>
    {% endfor %}
  </select>
  <select name="difficulty">
    <option value="1" {{ 'selected' if assignment.difficulty | int == 1 }}>Hard</option>
    <option value="2" {{ 'selected' if assignment.difficulty | int == 2 }}>Medium</option>
    <option value="3" {{ 'selected' if assignment.difficulty | int == 3 }}>Easy</option>
  </select>
  <button type="submit">Save</button>
  <a class="btn" href="/">Cancel</a>
</form>
{% endblock %}
